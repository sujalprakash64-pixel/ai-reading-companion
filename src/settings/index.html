<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Reading Companion — Settings</title>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0; background: #f6f7fb; color: #1a1f2b;
      display: flex; justify-content: center; padding: 48px 16px;
    }
    @media (prefers-color-scheme: dark) {
      body { background: #0f131c; color: #e6edf6; }
      .card { background: #161b26 !important; border-color: #2a3346 !important; }
      input, select { background: #1e2534 !important; color: #e6edf6 !important; border-color: #2a3346 !important; }
      .hint { color: #93a1b5 !important; }
    }
    .card {
      width: 100%; max-width: 460px; background: #fff; border: 1px solid #e3e7ef;
      border-radius: 16px; padding: 28px; box-shadow: 0 8px 30px rgba(20,24,40,.08);
    }
    h1 { font-size: 20px; margin: 0 0 4px; }
    .sub { color: #6a7488; font-size: 14px; margin: 0 0 22px; }
    label { display: block; font-size: 13px; font-weight: 600; margin: 16px 0 6px; }
    input, select {
      width: 100%; font-size: 14px; padding: 10px 12px; border-radius: 10px;
      border: 1px solid #d9deea; background: #fff; color: #1a1f2b;
    }
    input:focus, select:focus { outline: 2px solid #7c5cff; outline-offset: 0; }
    .hint { font-size: 12px; color: #8791a5; margin-top: 6px; }
    .hint a { color: #7c5cff; }
    button.save {
      margin-top: 24px; width: 100%; padding: 12px; font-size: 14px; font-weight: 700;
      color: #fff; background: linear-gradient(135deg, #6d7cff, #7c5cff);
      border: none; border-radius: 10px; cursor: pointer;
    }
    button.save:hover { filter: brightness(1.05); }
    .status { text-align: center; font-size: 13px; margin-top: 12px; min-height: 18px; color: #2fae6b; }
  </style>
</head>
<body>
  <div class="card">
    <h1>✨ AI Reading Companion</h1>
    <p class="sub">Bring your own API key. It's stored locally in your browser and only sent to the provider you choose.</p>

    <label for="provider">Provider</label>
    <select id="provider">
      <option value="claude">Anthropic (Claude)</option>
      <option value="openai">OpenAI</option>
    </select>

    <label for="model">Model</label>
    <input id="model" type="text" placeholder="model id" />
    <div class="hint" id="model-hint"></div>

    <label for="apiKey">API key</label>
    <input id="apiKey" type="password" placeholder="sk-… / your key" autocomplete="off" />
    <div class="hint">Stored in <code>chrome.storage.local</code> on this device only.</div>

    <button class="save" id="save">Save settings</button>
    <div class="status" id="status"></div>
  </div>

  <script type="module" src="./index.ts"></script>
</body>
</html>
