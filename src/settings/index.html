<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Reading Companion — Settings</title>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0; background: #f6f7fb; color: #1a1f2b;
      display: flex; justify-content: center; padding: 40px 16px 64px;
    }
    @media (prefers-color-scheme: dark) {
      body { background: #0f131c; color: #e6edf6; }
      .card { background: #161b26 !important; border-color: #2a3346 !important; }
      input, select { background: #1e2534 !important; color: #e6edf6 !important; border-color: #2a3346 !important; }
      .hint { color: #93a1b5 !important; }
      hr { border-color: #2a3346 !important; }
      details summary { color: #cdd8ea !important; }
    }
    .card {
      width: 100%; max-width: 480px; background: #fff; border: 1px solid #e3e7ef;
      border-radius: 16px; padding: 28px; box-shadow: 0 8px 30px rgba(20,24,40,.08);
    }
    h1 { font-size: 20px; margin: 0 0 4px; }
    .sub { color: #6a7488; font-size: 14px; margin: 0 0 20px; }
    label { display: block; font-size: 13px; font-weight: 600; margin: 16px 0 6px; }
    input, select {
      width: 100%; font-size: 14px; padding: 10px 12px; border-radius: 10px;
      border: 1px solid #d9deea; background: #fff; color: #1a1f2b;
    }
    input:focus, select:focus { outline: 2px solid #7c5cff; outline-offset: 0; }
    .hint { font-size: 12px; color: #8791a5; margin-top: 6px; }
    .hint a { color: #7c5cff; }
    .row { display: flex; gap: 8px; align-items: center; }
    .row label { display: inline; margin: 0; font-weight: 500; }
    button {
      font-size: 14px; font-weight: 700; border: none; border-radius: 10px; cursor: pointer;
      color: #fff; background: linear-gradient(135deg, #6d7cff, #7c5cff); padding: 11px 14px;
    }
    button:hover { filter: brightness(1.05); }
    button.ghost { background: none; color: #d1435b; font-weight: 600; padding: 8px 0; }
    .actions { margin-top: 22px; display: flex; gap: 10px; }
    .actions button.save { flex: 1; }
    .status { text-align: center; font-size: 13px; margin-top: 12px; min-height: 18px; color: #2fae6b; }
    hr { border: none; border-top: 1px solid #eceef4; margin: 26px 0 6px; }
    details summary { cursor: pointer; font-size: 14px; font-weight: 600; color: #37415a; padding: 8px 0; }
    .hidden { display: none !important; }
    .adv { font-size: 12px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>✨ AI Reading Companion</h1>
    <p class="sub">Pick a provider and add your key. Each provider keeps its own key &amp; model. Keys are stored locally in your browser.</p>

    <label for="provider">Provider</label>
    <select id="provider"></select>

    <label for="model">Model</label>
    <input id="model" type="text" list="model-list" placeholder="model id" autocomplete="off" />
    <datalist id="model-list"></datalist>
    <div class="hint" id="model-hint"></div>

    <div id="apikey-group">
      <label for="apiKey">API key</label>
      <input id="apiKey" type="password" placeholder="paste your key" autocomplete="off" />
      <div class="hint" id="key-hint">Stored in <code>chrome.storage.local</code> on this device only.</div>
    </div>

    <div id="baseurl-group">
      <label for="baseUrl">Base URL</label>
      <input id="baseUrl" type="text" placeholder="https://…" autocomplete="off" />
      <div class="hint" id="baseurl-hint"></div>
    </div>

    <div class="actions">
      <button class="save" id="save">Save settings</button>
      <button class="ghost hidden" id="remove">Remove</button>
    </div>
    <div class="status" id="status"></div>

    <hr />
    <details id="add-details">
      <summary>➕ Add a custom provider</summary>
      <label for="c-label">Name</label>
      <input id="c-label" type="text" placeholder="e.g. My Gateway" autocomplete="off" />

      <label for="c-adapter">API type</label>
      <select id="c-adapter"></select>

      <label for="c-baseUrl">Base URL</label>
      <input id="c-baseUrl" type="text" placeholder="https://api.example.com/v1" autocomplete="off" />
      <div class="hint">For OpenAI-compatible, the root that serves <code>/chat/completions</code>.</div>

      <label for="c-model">Default model</label>
      <input id="c-model" type="text" placeholder="model id" autocomplete="off" />

      <div class="row" style="margin-top:14px">
        <input id="c-key-required" type="checkbox" checked style="width:auto" />
        <label for="c-key-required">Requires an API key</label>
      </div>

      <div class="actions">
        <button id="c-add">Add provider</button>
      </div>
      <div class="status" id="c-status" style="color:#d1435b"></div>
    </details>
  </div>

  <script type="module" src="./index.ts"></script>
</body>
</html>
