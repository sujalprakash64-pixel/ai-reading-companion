name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Check dist output
        run: |
          test -f dist/manifest.json
          test -f dist/content.js
          test -f dist/background.js
          test -f dist/src/settings/index.html
          echo "dist output looks good"
